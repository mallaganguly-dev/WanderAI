[project]
name = "wanderai"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask",
  "jinja2",
  "requests",
  "google-genai",
  "python-dotenv",
]

[project.optional-dependencies]
agent = [
  "crewai",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
