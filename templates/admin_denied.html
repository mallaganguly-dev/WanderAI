<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied | WanderAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            font-family: "DM Sans", -apple-system,
                         BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
        }

        .denied-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .denied-icon {
            font-size: 46px;
            margin-bottom: 14px;
        }

        .denied-card h1 {
            font-size: 22px;
            margin: 0 0 10px;
        }

        .denied-card p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 24px;
        }

        .denied-button {
            display: inline-block;
            background: #111827;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="denied-card">

    <div class="denied-icon">
        🔒
    </div>

    <h1>
        Main Admin Only
    </h1>

    <p>
        Only the main admin can manage admin accounts
        and grant access to other admins.
    </p>

    <a href="{{ url_for('admin.admin_dashboard') }}"
       class="denied-button">
        Back to Dashboard
    </a>

</div>

</body>

</html>
