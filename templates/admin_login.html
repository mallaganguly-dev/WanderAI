<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | WanderAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
        }

        .admin-auth-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .admin-auth-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .admin-badge {
            display: inline-block;
            background: #111827;
            color: white;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 18px;
        }

        .admin-logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .admin-logo span {
            color: #667eea;
        }

        .admin-title {
            text-align: center;
            margin-bottom: 6px;
        }

        .admin-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .admin-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .admin-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .admin-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-button:hover {
            background: #1f2937;
        }

        .admin-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .admin-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .admin-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="admin-auth-container">

    <div class="admin-auth-card">

        <span class="admin-badge">
            RESTRICTED AREA
        </span>

        <div class="admin-logo">
            Wander<span>AI</span>
        </div>

        <h2 class="admin-title">
            Admin Login
        </h2>

        <p class="admin-subtitle">
            Authorized administrators only.
        </p>

        {% if error %}
        <div class="admin-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST"
              action="{{ url_for('admin.admin_login') }}">

            <input
                type="email"
                name="email"
                class="admin-input"
                placeholder="Admin email"
                required
                autofocus
            >

            <input
                type="password"
                name="password"
                class="admin-input"
                placeholder="Password"
                required
            >

            <button type="submit" class="admin-button">
                Login as Admin
            </button>

        </form>

        <div class="admin-footer">
            <a href="/">← Back to WanderAI</a>
        </div>

    </div>

</div>

</body>

</html>
