<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | WanderAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
        }

        .auth-logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .auth-logo span {
            color: #667eea;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-button {
            margin-top: 12px;
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
        }

        .auth-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
        }

        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            Wander<span>AI</span>
        </div>

        <h2 class="auth-title">Welcome Back</h2>

        <input
            type="email"
            id="loginEmail"
            class="auth-input"
            placeholder="Email address"
        >

        <input
            type="password"
            id="loginPassword"
            class="auth-input"
            placeholder="Password"
        >

        <button
            class="auth-button"
            onclick="loginUser()"
        >
            Login
        </button>

        <button
            class="auth-button google-button"
            onclick="googleLogin()"
        >
            Continue with Google
        </button>

        <div id="authMessage" class="auth-message"></div>

        <div class="auth-footer">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </div>

        <div class="auth-footer">
            <a href="/">← Back to WanderAI</a>
        </div>

    </div>

</div>

<script type="module"
        src="{{ url_for('static', filename='js/auth.js') }}">
</script>

</body>

</html>
